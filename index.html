<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network</title>
<meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171713" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Network">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-render-blocking on purpose: a stalled font fetch must never delay
     the module script (Chrome holds parser-inserted scripts for pending
     stylesheets), which once left the app stuck on "Loading…" forever. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div class="app">
  <nav class="nav" id="tabs" hidden aria-label="Main">
    <div class="brand"><span class="brand-mark"></span>NETWORK</div>
    <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></a>
    <a href="#/people" data-tab="people"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.7.7 2.8 2.5 3 5.2"/></svg><span>People</span></a>
    <a href="#/overdue" data-tab="overdue"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5M12 16.2v.3"/></svg><span>Overdue</span></a>
    <a href="#/followups" data-tab="followups"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12.2l2.6 2.6L16 9.4"/></svg><span>Follow-ups</span></a>
    <a href="#/events" data-tab="events"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M12 10.6l1.1 2.3 2.5.4-1.8 1.8.4 2.5-2.2-1.2-2.2 1.2.4-2.5-1.8-1.8 2.5-.4z"/></svg><span>Events</span></a>
    <a href="#/calendar" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
  </nav>
  <main class="shell">
    <header class="pagehead" id="pagehead">
      <div class="ph-text"><div class="kicker" id="kicker"></div><h1 id="title">Network</h1></div>
      <div class="ph-actions">
        <button class="iconbtn" id="themeBtn" type="button" aria-label="Theme"></button>
        <button class="pill" id="addPersonBtn" type="button" hidden>+ New</button>
      </div>
    </header>
    <div id="view" class="view"><div class="empty">Loading…</div></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="grip" aria-hidden="true"></div>
  <header class="panel-head">
    <div class="ph-text"><div class="kicker" id="pKicker"></div><h2 id="pTitle"></h2></div>
    <div class="panel-actions" id="pActions"></div>
    <button class="iconbtn" id="pClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="panel-body" id="pBody"></div>
</section>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
